[defaults]
# Driver priority
ntfs_drivers=ntfs-3g,ntfs3

# Global fallback permissions
ntfs_allow=uid=$UID,gid=$GID,umask,dmask,fmask,locale,norecover,ignore_case,compression,nocompression,windows_names,force

# NTFS-3G Explicit Rules (This is what was blocking the mount)
ntfs:ntfs-3g_allow=uid=$UID,gid=$GID,umask,dmask,fmask,locale,norecover,ignore_case,windows_names,force
ntfs:ntfs-3g_defaults=uid=$UID,gid=$GID,windows_names

# NTFS3 Kernel Rules
ntfs:ntfs3_allow=uid=$UID,gid=$GID,umask,dmask,fmask,locale,norecover,ignore_case,compression,nocompression,force
ntfs:ntfs3_defaults=uid=$UID,gid=$GID,force

