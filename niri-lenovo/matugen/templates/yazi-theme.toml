# : Manager [[[

[mgr]
cwd = { fg = "{{colors.primary.default.hex}}" }

# Find
find_keyword  = { fg = "{{colors.error.default.hex}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{colors.error.default.hex}}", bold = true, italic = true }

# Marker - Fixed: Using Primary/Secondary for better visibility
marker_copied   = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
marker_cut      = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked   = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
marker_selected = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

# Count
count_copied   = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
count_cut      = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" }
count_selected = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

# Border
border_symbol = "│"
border_style  = { fg = "{{colors.outline.default.hex}}" }

# : ]]]

# : Tabs [[[

[tabs]
active    = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}", bold = true }
inactive  = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }
sep_inner = { open = " ", close = " " }

# : ]]]

# : Mode [[[

[mode]
normal_main = { bg = "{{colors.primary.default.hex}}", fg = "{{colors.on_primary.default.hex}}", bold = true }
normal_alt  = { bg = "{{colors.surface_variant.default.hex}}", fg = "{{colors.primary.default.hex}}" }

select_main = { bg = "{{colors.secondary.default.hex}}", fg = "{{colors.on_secondary.default.hex}}", bold = true }
select_alt  = { bg = "{{colors.surface_variant.default.hex}}", fg = "{{colors.secondary.default.hex}}" }

unset_main = { bg = "{{colors.error.default.hex}}", fg = "{{colors.on_error.default.hex}}", bold = true }
unset_alt  = { bg = "{{colors.surface_variant.default.hex}}", fg = "{{colors.error.default.hex}}" }

# : ]]]

# : Status [[[

[status]
# Fix: Using standard hex without complex filters that might fail parsing
perm_type  = { fg = "{{colors.tertiary.default.hex}}" }
perm_write = { fg = "{{colors.error.default.hex}}" }
perm_read  = { fg = "{{colors.primary.default.hex}}" }
perm_exec  = { fg = "{{colors.secondary.default.hex}}" }
perm_sep   = { fg = "{{colors.outline.default.hex}}" }

progress_label  = { bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
progress_error  = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

# : ]]]

# : File-specific styles [[[

[filetype]

rules = [
    # Images - Synced to Tertiary
    { mime = "image/*", fg = "{{colors.tertiary.default.hex}}" },

    # Media - Synced to Secondary
    { mime = "{audio,video}/*", fg = "{{colors.secondary.default.hex}}" },

    # Archives - Synced to Error (usually stands out)
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{colors.error.default.hex}}" },

    # Documents - Synced to Primary
    { mime = "application/{pdf,doc,rtf}", fg = "{{colors.primary.default.hex}}" },

    # Special files
    { name = "*", is = "orphan", bg = "{{colors.error.default.hex}}", fg = "{{colors.on_error.default.hex}}" },
    { name = "*", is = "exec", fg = "{{colors.primary.default.hex}}", bold = true },

    # Fallback
    { url = "*", fg = "{{colors.on_surface.default.hex}}" },
    { url = "*/", fg = "{{colors.primary.default.hex}}", bold = true },
]

# : ]]]
